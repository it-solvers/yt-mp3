[package]
name = "yt-mp3"
version = "1.0.72"
edition = "2024"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
eframe = { version = "0.37.0", features = ["persistence"] }
fastrand = "2.5.0"
open = "5.4.5"
rfd = "0.18.0"
rodio = { version = "0.23.0", features = ["symphonia-alac"] }
rustysynth = "1.3.8"
sys-locale = "0.3.2"
trash = "5.4.0"

# 개발용 build에서도 MIDI 소리가 끊기지 않도록 합성 library는 최적화
[profile.dev.package.rustysynth]
opt-level = 3

# Mac 메뉴 막대를 정리할 때 사용 (창을 만드는 library가 이미 쓰는 version)
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.2.2", features = ["NSApplication", "NSMenu", "NSMenuItem", "NSResponder"] }
objc2-foundation = { version = "0.2.2", features = ["NSString"] }
